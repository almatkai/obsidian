[package]
name = "tezbar-obsidian"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
protocol-fixtures = []

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chrono = "0.4"
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust", rev = "1a11afc14693cc6463e0b95ae7d61991b4a60427" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
